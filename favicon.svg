  <rect x="7" y="7" width="52" height="52" rx="14" fill="#111111" />
  <rect x="4" y="4" width="52" height="52" rx="14" fill="#FFE500" stroke="#111111" stroke-width="3.5" />
  
  <!-- Stylized Blood / Health Drop -->
  <path d="M30 13 C30 13 17 28 17 38 C17 46 22.8 51 30 51 C37.2 51 43 46 43 38 C43 28 30 13 30 13 Z" 
        fill="#EF4444" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  
